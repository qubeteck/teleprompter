<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#070b14" />
    <meta name="description" content="Advanced Teleprompter Studio — a local-first script studio, teleprompter, recorder, and backup tool for presenters and creators." />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' blob: data:; worker-src 'self' blob:; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Teleprompter" />
    <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Advanced Teleprompter Studio</title>
    <style>
      .boot-splash {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 30%, #111c34 0%, #070b14 60%);
        color: #e2e8f0;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .boot-splash__inner { text-align: center; padding: 2rem; }
      .boot-splash__mark {
        width: 74px; height: 74px; border-radius: 22px; margin: 0 auto 1.25rem;
        display: grid; place-items: center; font-size: 2rem;
        background: linear-gradient(135deg, #22d3ee33, #818cf833);
        border: 1px solid #22d3ee55; box-shadow: 0 0 60px #22d3ee22;
      }
      .boot-splash__spinner {
        width: 26px; height: 26px; margin: 1.25rem auto 0; border-radius: 999px;
        border: 2px solid #1e293b; border-top-color: #22d3ee; animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-splash__spinner { animation-duration: 2s; } }
      .noscript { margin-top: 1rem; color: #fbbf24; max-width: 34rem; line-height: 1.6; }
    </style>
  </head>
  <body class="h-full">
    <a class="skip-link" href="#view">Skip to main content</a>
    <div id="app" class="min-h-full">
      <div class="boot-splash" aria-live="polite">
        <div class="boot-splash__inner">
          <div class="boot-splash__mark" aria-hidden="true">⚡</div>
          <h1 style="font-size: 1.25rem; font-weight: 700; margin: 0">Advanced Teleprompter Studio</h1>
          <p style="color: #94a3b8; margin: 0.5rem 0 0">Opening your local studio…</p>
          <div class="boot-splash__spinner" aria-hidden="true"></div>
          <noscript>
            <p class="noscript">
              This application needs JavaScript to run. Your scripts never leave your device, and the app requires no account.
            </p>
          </noscript>
        </div>
      </div>
    </div>
    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="false"></div>
    <div id="print-root" aria-hidden="true"></div>
    <script type="module" src="/src/js/app.js"></script>
  </body>
</html>
